<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Proveedores - GestorFX</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
  <link rel="stylesheet" href="../styles.css">
  <script>
    if (!localStorage.getItem('logueado')) {
      window.location.href = 'login.html';
    }
  </script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script defer src="../js/suppliers.js"></script>
  <script src="../js/layout.js"></script>
</head>
<body>
  <div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <div><h1 class="mb-1">Proveedores</h1><p class="text-muted mb-0">Administra tus proveedores y abastecimiento.</p></div>
      <button id="new-supplier-btn" type="button" class="btn btn-primary"><i class="fa fa-plus me-2"></i>Registrar Proveedor</button>
    </div>

    <div class="modal fade" id="supplier-form-modal" tabindex="-1" aria-labelledby="supplier-form-modal-title" aria-hidden="true">
      <div class="modal-dialog modal-lg modal-dialog-centered">
        <div class="modal-content product-modal-content">
          <div class="modal-header product-modal-header">
            <div><span class="product-modal-kicker"><i class="fa fa-truck me-2"></i>Directorio de proveedores</span><h5 class="modal-title" id="supplier-form-modal-title">Registrar Proveedor</h5><p class="product-modal-subtitle mb-0">Guarda los datos de contacto y abastecimiento.</p></div>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
          </div>
          <div class="modal-body product-modal-body">
      <form id="supplier-form" class="row g-3 product-form-shell">
        <input type="hidden" id="supplier-id">
        <div class="col-md-6"><label class="form-label">Nombre del Proveedor</label><input id="supplier-name" class="form-control" required></div>
        <div class="col-md-6"><label class="form-label">NIT</label><input id="supplier-nit" class="form-control"></div>
        <div class="col-md-6"><label class="form-label">Dirección</label><input id="supplier-address" class="form-control"></div>
        <div class="col-md-6"><label class="form-label">Correo</label><input id="supplier-email" class="form-control" type="email"></div>
        <div class="col-md-4"><label class="form-label">Teléfono</label><input id="supplier-phone" class="form-control"></div>
        <div class="col-12 d-flex gap-2">
          <button id="cancel-edit" class="btn btn-light px-4" type="button">Cancelar</button>
          <button id="save-supplier" class="btn btn-primary px-4"><i class="fa fa-check me-2"></i>Guardar proveedor</button>
        </div>
      </form>
          </div>
        </div>
      </div>
    </div>

    <div class="card p-4">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h5 class="mb-0">Listado de Proveedores</h5>
        <div class="d-flex gap-2">
          <button id="exportExcelBtn" class="btn btn-success btn-sm mx-1" title="Exportar a Excel">
              <i class="fas fa-file-excel"></i> Exportar Excel
          </button>
          <button id="exportPdfBtn" class="btn btn-danger btn-sm mx-1" title="Exportar a PDF">
              <i class="fas fa-file-pdf"></i> Exportar PDF
          </button>
          <input id="search-supplier" class="form-control" style="width: 250px;" placeholder="Buscar por nombre...">
        </div>
      </div>
      <div class="table-responsive">
        <table class="table table-striped">
          <thead>
            <tr>
              <th>Nombre</th>
              <th>NIT</th>
              <th>Dirección</th>
              <th>Correo</th>
              <th>Teléfono</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody id="suppliers-table"></tbody>
        </table>
      </div>
    </div>
  </div>
</body>
</html>
