<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Órdenes de Compra - GestorFX</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="../styles.css">
    <script>
      if (!localStorage.getItem('logueado')) {
        window.location.href = 'login.html';
      }
    </script>
    <script defer src="../js/purchase_orders.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>
    <div class="container py-4">
        <h1>Órdenes de Compra</h1>
        <a href="index.html" class="btn btn-secondary mb-3"><i class="fa fa-arrow-left me-2"></i>Volver</a>

        <div class="card p-4 mb-4">
            <h5 class="mb-3">Registrar / Editar Orden de Compra</h5>
            <form id="purchase-order-form" class="row g-3">
                <input type="hidden" id="purchase-order-id">
                <div class="col-md-6">
                    <label class="form-label">Proveedor</label>
                    <select id="supplier-id" class="form-select" required></select>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Fecha de Orden</label>
                    <input type="date" id="order-date" class="form-control" required>
                </div>
                <div class="col-12">
                    <h6>Productos</h6>
                    <div id="product-items"></div>
                    <button type="button" id="add-product-item" class="btn btn-success btn-sm mt-2">Agregar Producto</button>
                </div>
                <div class="col-12 d-flex gap-2">
                    <button id="save-purchase-order" class="btn btn-primary px-4">Guardar</button>
                    <button id="cancel-edit" class="btn btn-secondary px-4" type="button" style="display:none">Cancelar</button>
                </div>
            </form>
        </div>

        <div class="card p-4">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h5 class="mb-0">Listado de Órdenes de Compra</h5>
                <input id="search-purchase-order" class="form-control" style="width: 250px;" placeholder="Buscar...">
            </div>
            <table class="table table-striped">
                <thead>
                    <tr>
                        <th># Orden</th>
                        <th>Proveedor</th>
                        <th>Fecha</th>
                        <th>Total</th>
                        <th>Estado</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="purchase-orders-table">
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
