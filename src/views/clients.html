<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Clientes - GestorFX</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
  <link rel="stylesheet" href="../styles.css">
  <script>
    if (!localStorage.getItem('logueado')) {
      window.location.href = 'login.html';
    }
  </script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="../js/layout.js"></script>
  <script defer src="../js/clients.js"></script>
</head>
<body>
  <div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <div><h1 class="mb-1">Clientes</h1><p class="text-muted mb-0">Administra la información de tus clientes.</p></div>
      <button id="new-client-btn" type="button" class="btn btn-primary"><i class="fa fa-plus me-2"></i>Registrar Cliente</button>
    </div>

    <div class="modal fade" id="client-form-modal" tabindex="-1" aria-labelledby="client-form-modal-title" aria-hidden="true">
      <div class="modal-dialog modal-lg modal-dialog-centered">
        <div class="modal-content product-modal-content">
          <div class="modal-header product-modal-header">
            <div><span class="product-modal-kicker"><i class="fa fa-user me-2"></i>Directorio de clientes</span><h5 class="modal-title" id="client-form-modal-title">Registrar Cliente</h5><p class="product-modal-subtitle mb-0">Guarda la información necesaria para ventas, créditos y facturación.</p></div>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
          </div>
          <div class="modal-body product-modal-body">
      <form id="client-form" class="row g-3 product-form-shell">
        <input type="hidden" id="client-id">
        <div class="col-md-6"><label class="form-label">Nombre</label><input id="client-name" class="form-control" required></div>
        <div class="col-md-6"><label class="form-label">NIT / Cédula</label><input id="client-idcard" class="form-control" required></div>
        <div class="col-md-6"><label class="form-label">Dirección</label><input id="client-address" class="form-control"></div>
        <div class="col-md-6"><label class="form-label">Correo</label><input id="client-email" class="form-control" type="email"></div>
        <div class="col-md-4"><label class="form-label">Teléfono</label><input id="client-phone" class="form-control"></div>
        <div class="col-12 d-flex gap-2">
          <button id="cancel-edit" class="btn btn-light px-4" type="button">Cancelar</button>
          <button id="save-client" class="btn btn-primary px-4"><i class="fa fa-check me-2"></i>Guardar cliente</button>
        </div>
      </form>
          </div>
        </div>
      </div>
    </div>

    <div class="card p-4">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h5 class="mb-0">Listado de clientes</h5>
        <input id="search-client" class="form-control" style="width: 250px;" placeholder="Buscar por nombre...">
      </div>
      <div class="table-responsive">
        <table class="table table-striped align-middle">
          <thead><tr><th>Nombre</th><th>NIT/CC</th><th>Dirección</th><th>Correo</th><th>Tel</th><th>Acciones</th></tr></thead>
          <tbody id="clients-table"></tbody>
        </table>
      </div>
    </div>
  </div>
</body>
</html>
