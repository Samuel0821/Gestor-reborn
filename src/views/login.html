<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Login - GestorFX</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
  <link rel="stylesheet" href="../styles.css">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script defer src="../js/login.js"></script>
</head>
<body>

    <div class="login-page">
        <div class="login-card">
            <div class="login-header">
                <img src="../logo/gestorfx_logof.ico" alt="Logo" style="height: 80px; width: auto;">
                <h2>Bienvenido</h2>
                <p class="text-muted mb-0">Inicia sesión para continuar</p>
            </div>
            
            <div class="login-body pt-0">
                <!-- Alerta de errores -->
                <div id="login-alert" class="alert alert-danger d-none d-flex align-items-center" role="alert">
                    <i class="fa fa-exclamation-circle me-2"></i>
                    <span id="login-alert-msg">Error de credenciales</span>
                </div>

                <form id="login-form">
                    <!-- Usuario -->
                    <div class="mb-4">
                        <label class="form-label text-muted small fw-bold ms-1">USUARIO</label>
                        <div class="input-group login-input-group">
                            <span class="input-group-text"><i class="fa fa-user"></i></span>
                            <input type="text" id="login-user" class="form-control" placeholder="Ej. admin" required autocomplete="username" autofocus>
                        </div>
                    </div>

                    <!-- Contraseña -->
                    <div class="mb-2">
                        <label class="form-label text-muted small fw-bold ms-1">CONTRASEÑA</label>
                        <div class="input-group login-input-group">
                            <span class="input-group-text"><i class="fa fa-lock"></i></span>
                            <input type="password" id="login-pass" class="form-control" placeholder="••••••••" required autocomplete="current-password">
                            <button class="btn btn-link text-muted text-decoration-none" type="button" id="toggle-password" tabindex="-1">
                                <i class="fa fa-eye"></i>
                            </button>
                        </div>
                        <!-- Indicador Caps Lock -->
                        <div id="caps-lock-warning" class="caps-lock-indicator">
                            <i class="fa fa-arrow-up me-1"></i> Mayúsculas activadas
                        </div>
                    </div>

                    <!-- Opciones extra -->
                    <div class="d-flex justify-content-between align-items-center mb-4">
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="remember-me">
                            <label class="form-check-label small text-muted" for="remember-me">Recordar usuario</label>
                        </div>
                    </div>

                    <!-- Botón Submit -->
                    <button type="submit" class="btn btn-primary w-100 btn-login text-white" id="login-btn">
                        <span class="btn-text">INGRESAR</span>
                        <div class="spinner-border spinner-border-sm text-white d-none" role="status" id="login-spinner"></div>
                    </button>
                </form>
            </div>
        </div>

        <!-- Footer Comercial -->
        <div class="login-footer">
            <div class="mb-1">GestorFX ERP &copy; 2026</div>
            <div class="d-flex align-items-center justify-content-center gap-2 opacity-75">
                <span class="badge bg-dark border border-secondary text-light fw-normal">v1.0.6</span>
                <span class="small"><i class="fa fa-database text-success me-1"></i>Conectado</span>
            </div>
        </div>
    </div>

</body>
</html>
