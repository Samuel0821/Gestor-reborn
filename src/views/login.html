<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Login - GestorFX</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
  <!-- Hoja de estilos unificada -->
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script defer src="../js/login.js"></script>
</head>
<body>
  <!-- Logo de la aplicación -->
  <div style="text-align: center; margin-bottom: 20px;">
    <img src="../logo/gestorfx_logo.ico" alt="Logo GestorFX" style="width: 150px; height: auto;">
  </div>

  <div class="login-card">
    <i class="fa fa-user-lock"></i>
    <div class="login-title">Iniciar Sesión</div>
    <form id="login-form">
      <div class="mb-3">
        <label class="form-label">Usuario</label>
        <input id="login-user" class="form-control" required autofocus>
      </div>
      <div class="mb-3">
        <label class="form-label">Contraseña</label>
        <input id="login-pass" type="password" class="form-control" required>
      </div>
      <div id="login-error" class="error-msg" style="display:none"></div>
      <button type="submit" class="btn btn-primary w-100">Entrar</button>
    </form>
  </div>
</body>
</html>
