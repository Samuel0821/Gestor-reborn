<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Login - GestorFX</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
  <link rel="stylesheet" href="../styles.css">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script defer src="../js/login.js"></script>
</head>
<body class="login-page">
  <div class="login-card">
    <div class="login-header">
      <div class="mb-3">
        <img src="../logo/gestorfx_logof.ico" alt="Logo" style="height: 120px; width: auto;">
      </div>
      <p>Sistema de Gestión Empresarial</p>
    </div>
    <div class="login-body">
      <form id="login-form">
        <div class="form-floating mb-3">
          <input type="text" class="form-control" id="login-user" placeholder="Usuario" required autofocus>
          <label for="login-user"><i class="fa fa-user me-2"></i>Usuario</label>
        </div>
        <div class="form-floating mb-4">
          <input type="password" class="form-control" id="login-pass" placeholder="Contraseña" required>
          <label for="login-pass"><i class="fa fa-lock me-2"></i>Contraseña</label>
        </div>
        <button type="submit" class="btn btn-primary w-100 py-2 fs-5 fw-bold shadow-sm">
          Ingresar <i class="fa fa-arrow-right ms-2"></i>
        </button>
      </form>
      <div id="login-error" class="alert alert-danger mt-3 text-center" style="display:none" role="alert"></div>
    </div>
    <div class="text-center pb-4 text-muted small">
      &copy; 2026 Grisalis Technologies
    </div>
  </div>
</body>
</html>
