<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Control de Gastos - GestorFX</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
  <link rel="stylesheet" href="../styles.css">
  <script>
    if (!localStorage.getItem('logueado')) window.location.href = 'login.html';
  </script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="../js/layout.js"></script>
</head>
<body>
  <!-- El contenido será inyectado dentro del layout por expenses.js -->
  <div class="container">
    <div class="d-flex justify-content-between align-items-center mb-4 mt-4">
      <div><h2 class="mb-1"><i class="fa fa-money-bill-wave text-danger me-2"></i>Control de Gastos</h2><p class="text-muted mb-0">Registra y controla los egresos del negocio.</p></div>
      <button id="new-expense-btn" type="button" class="btn btn-primary"><i class="fa fa-plus me-2"></i>Registrar Gasto</button>
    </div>

    <div>
        <div class="modal fade" id="expense-form-modal" tabindex="-1" aria-labelledby="expense-form-modal-title" aria-hidden="true">
          <div class="modal-dialog modal-lg modal-dialog-centered">
            <div class="modal-content product-modal-content">
              <div class="modal-header product-modal-header">
                <div><span class="product-modal-kicker"><i class="fa fa-money-bill-wave me-2"></i>Control financiero</span><h5 class="modal-title" id="expense-form-modal-title">Registrar Gasto</h5><p class="product-modal-subtitle mb-0">Registra el egreso y su impacto en caja.</p></div>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
              </div>
              <div class="modal-body product-modal-body">
            <form id="expense-form">
              <div class="mb-3">
                <label class="form-label">Descripción</label>
                <input type="text" id="expense-desc" class="form-control" placeholder="Ej: Pago de Luz, Arriendo..." required>
              </div>
              <div class="mb-3">
                <label class="form-label">Monto</label>
                <input type="number" id="expense-amount" class="form-control" placeholder="0.00" min="1" required>
              </div>
              <div class="mb-3">
                <label class="form-label">Método de Pago</label>
                <select id="expense-method" class="form-select">
                  <option value="cash">Efectivo</option>
                  <option value="transfer">Transferencia</option>
                </select>
              </div>
              <div class="mb-3" id="expense-ref-container" style="display:none;">
                <label class="form-label">Referencia / Banco (opcional)</label>
                <input type="text" id="expense-reference" class="form-control" placeholder="Número de referencia / banco">
              </div>
              <div class="mb-3">
                <label class="form-label">Categoría</label>
                <select id="expense-category" class="form-select">
                  <option value="Servicios">Servicios Públicos</option>
                  <option value="Proveedores">Pago a Proveedores</option>
                  <option value="Transporte">Transporte / Logística</option>
                  <option value="Devolución">Devolución de Productos</option>
                  <option value="Nomina">Nómina / Empleados</option>
                  <option value="Arriendo">Arriendo</option>
                  <option value="Mantenimiento">Mantenimiento</option>
                  <option value="Otros">Otros</option>
                </select>
              </div>
              <div class="mb-3">
                <label class="form-label">Fecha</label>
                <input type="date" id="expense-date" class="form-control" required>
              </div>
              <button type="submit" class="btn btn-danger w-100"><i class="fa fa-save me-2"></i>Guardar Gasto</button>
            </form>
              </div>
            </div>
          </div>
        </div>
        <div class="card shadow-sm">
          <div class="card-body">
            <div class="d-flex justify-content-between mb-3">
              <h5 class="card-title">Historial de Egresos</h5>
              <div class="fw-bold fs-5 text-danger" id="total-expenses">Total: $0</div>
            </div>
            <!-- Filtro de búsqueda -->
            <div class="mb-3">
              <input type="text" id="search-expense" class="form-control" placeholder="Buscar egreso por descripción, categoría o fecha...">
            </div>
            <div class="table-responsive">
              <table class="table table-hover">
                <thead>
                  <tr>
                    <th>Fecha</th>
                    <th>Descripción</th>
                    <th>Categoría</th>
                    <th>Método</th>
                    <th class="text-end">Monto</th>
                    <th>Acción</th>
                  </tr>
                </thead>
                <tbody id="expenses-table-body">
                  <!-- JS -->
                </tbody>
              </table>
            </div>
          </div>
        </div>
    </div>
  </div>
  <script src="../js/expenses.js"></script>
</body>
</html>
