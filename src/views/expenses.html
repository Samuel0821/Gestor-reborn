<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Control de Gastos - GestorFX</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
  <link rel="stylesheet" href="../styles.css">
  <script>
    if (!localStorage.getItem('logueado')) window.location.href = 'login.html';
  </script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="../js/layout.js"></script>
</head>
<body>
  <!-- El contenido será inyectado dentro del layout por expenses.js -->
  <div class="container">
    <div class="d-flex justify-content-between align-items-center mb-4 mt-4">
      <h2><i class="fa fa-money-bill-wave text-danger me-2"></i>Control de Gastos</h2>
    </div>

    <div class="row">
      <!-- Formulario de Registro -->
      <div class="col-md-4">
        <div class="card shadow-sm">
          <div class="card-header bg-danger text-white">
            <h5 class="mb-0">Registrar Nuevo Gasto</h5>
          </div>
          <div class="card-body">
            <form id="expense-form">
              <div class="mb-3">
                <label class="form-label">Descripción</label>
                <input type="text" id="expense-desc" class="form-control" placeholder="Ej: Pago de Luz, Arriendo..." required>
              </div>
              <div class="mb-3">
                <label class="form-label">Monto</label>
                <input type="number" id="expense-amount" class="form-control" placeholder="0.00" min="1" required>
              </div>
              <div class="mb-3">
                <label class="form-label">Categoría</label>
                <select id="expense-category" class="form-select">
                  <option value="Servicios">Servicios Públicos</option>
                  <option value="Proveedores">Pago a Proveedores</option>
                  <option value="Transporte">Transporte / Logística</option>
                  <option value="Devolución">Devolución de Productos</option>
                  <option value="Nomina">Nómina / Empleados</option>
                  <option value="Arriendo">Arriendo</option>
                  <option value="Mantenimiento">Mantenimiento</option>
                  <option value="Otros">Otros</option>
                </select>
              </div>
              <div class="mb-3">
                <label class="form-label">Fecha</label>
                <input type="date" id="expense-date" class="form-control" required>
              </div>
              <button type="submit" class="btn btn-danger w-100"><i class="fa fa-save me-2"></i>Guardar Gasto</button>
            </form>
          </div>
        </div>
      </div>

      <!-- Listado de Gastos -->
      <div class="col-md-8">
        <div class="card shadow-sm">
          <div class="card-body">
            <div class="d-flex justify-content-between mb-3">
              <h5 class="card-title">Historial de Egresos</h5>
              <div class="fw-bold fs-5 text-danger" id="total-expenses">Total: $0</div>
            </div>
            <div class="table-responsive">
              <table class="table table-hover">
                <thead>
                  <tr>
                    <th>Fecha</th>
                    <th>Descripción</th>
                    <th>Categoría</th>
                    <th class="text-end">Monto</th>
                    <th>Acción</th>
                  </tr>
                </thead>
                <tbody id="expenses-table-body">
                  <!-- JS -->
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script src="../js/expenses.js"></script>
</body>
</html>
