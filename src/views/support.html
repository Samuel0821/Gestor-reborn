<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Soporte Técnico - GestorFX</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
  <link rel="stylesheet" href="../styles.css">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="../js/layout.js"></script>
</head>
<body>
  <!-- El contenido será inyectado dentro del layout por support.js -->
  <div class="container">
    <div class="card shadow-sm mt-4 border-0">
      <div class="card-header bg-primary text-white py-3">
        <h5 class="mb-0"><i class="fa fa-headset me-2"></i>Soporte Técnico</h5>
      </div>
      <div class="card-body p-4">
        <p class="text-muted mb-4">
          Si presenta algún problema, error en el sistema o tiene alguna duda, por favor descríbalo detalladamente a continuación. 
          Esta información será enviada directamente a nuestro equipo de soporte técnico.
        </p>
        <form id="support-form">
          <div class="mb-3">
            <label for="support-subject" class="form-label fw-bold">Asunto / Tipo de Error</label>
            <input type="text" class="form-control" id="support-subject" placeholder="Ej: Error al guardar venta, Problema con impresora..." required>
          </div>
          <div class="mb-4">
            <label for="support-message" class="form-label fw-bold">Descripción detallada del problema</label>
            <textarea class="form-control" id="support-message" rows="8" placeholder="Describa qué estaba haciendo cuando ocurrió el error, mensajes que aparecieron, etc." required></textarea>
          </div>
          <div class="d-flex justify-content-end">
            <button type="submit" class="btn btn-primary btn-lg"><i class="fa fa-paper-plane me-2"></i>Enviar Reporte</button>
          </div>
        </form>
      </div>
    </div>
  </div>
  <script src="../js/support.js"></script>
</body>
</html>
