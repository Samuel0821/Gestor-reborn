<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Servicios - GestorFX</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
  <link rel="stylesheet" href="../styles.css">
  <script>
    if (!localStorage.getItem('logueado')) window.location.href = 'login.html';
  </script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script defer src="../js/services.js"></script>
</head>
<body>
  <div class="container py-4">
    <div class="mb-3">
      <h1>Gestión de Servicios</h1>
      <a href="index.html" class="btn btn-secondary mt-2"><i class="fa fa-arrow-left me-2"></i>Volver</a>
    </div>

    <!-- Formulario de Servicio -->
    <div class="card p-4 mb-4">
      <h5 class="mb-3">Registrar / Editar Servicio</h5>
      <form id="service-form">
        <input type="hidden" id="service-id">
        <div class="row g-3">
          <div class="col-md-6">
            <label class="form-label">Nombre del Servicio</label>
            <input type="text" id="service-name" class="form-control" required>
          </div>
          <div class="col-md-3">
            <label class="form-label">Precio Base (Mano de obra)</label>
            <input type="number" id="service-price" class="form-control" min="0" required>
          </div>
          <div class="col-md-3">
            <label class="form-label">Descripción</label>
            <input type="text" id="service-desc" class="form-control">
          </div>
        </div>

        <hr class="my-4">
        <h6>Productos / Materiales incluidos</h6>
        <div class="row g-2 align-items-end mb-3">
          <div class="col-md-6">
            <label class="form-label">Buscar Producto</label>
            <input list="products-list" id="product-search" class="form-control" placeholder="Escriba para buscar...">
            <datalist id="products-list"></datalist>
          </div>
          <div class="col-md-2">
            <label class="form-label">Cantidad</label>
            <input type="number" id="product-qty" class="form-control" value="1" min="1">
          </div>
          <div class="col-md-2">
            <button type="button" id="add-product-btn" class="btn btn-primary w-100">Agregar</button>
          </div>
        </div>

        <table class="table table-sm table-bordered">
          <thead class="table-light">
            <tr>
              <th>Producto</th>
              <th>Cantidad</th>
              <th>Costo Unit.</th>
              <th>Subtotal</th>
              <th>Acción</th>
            </tr>
          </thead>
          <tbody id="service-products-table"></tbody>
        </table>

        <div class="d-flex justify-content-end gap-2 mt-3">
          <button type="button" id="cancel-edit" class="btn btn-secondary" style="display:none;">Cancelar</button>
          <button type="submit" class="btn btn-success">Guardar Servicio</button>
        </div>
      </form>
    </div>

    <!-- Listado de Servicios -->
    <div class="card p-4">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h5 class="mb-0">Listado de Servicios</h5>
        <input type="text" id="search-service" class="form-control w-25" placeholder="Buscar servicio...">
      </div>
      <table class="table table-striped table-hover">
        <thead>
          <tr>
            <th>Nombre</th>
            <th>Descripción</th>
            <th>Precio Base</th>
            <th>Costo Materiales</th>
            <th>Precio Total Sugerido</th>
            <th>Acciones</th>
          </tr>
        </thead>
        <tbody id="services-table">
          <!-- JS render -->
        </tbody>
      </table>
    </div>
  </div>
</body>
</html>
