<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <title>Productos - GestorFX</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="../styles.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="../js/layout.js"></script>
    <script defer src="../js/products.js"></script>
    <script>
        if (!localStorage.getItem('logueado')) {
            window.location.href = 'login.html';
        }
    </script>
</head>
<body>
    <div class="container py-4">
        <h1>Productos</h1>
        <a href="index.html" class="btn btn-secondary mb-3"><i class="fa fa-arrow-left me-2"></i>Volver</a>

        <div class="card p-4 mb-4">
            <h5 class="mb-3">Registrar / Editar Producto</h5>
            <form id="product-form" class="row g-3">
                <input type="hidden" id="product-id">
                <div class="col-md-4">
                    <label class="form-label">Código</label>
                    <input id="product-code" class="form-control" required>
                    <span id="code-error-message" class="text-danger small mt-1"></span>
                </div>
                <div class="col-md-4">
                    <label class="form-label">Nombre</label>
                    <input id="product-name" class="form-control" required>
                </div>
                <div class="col-md-4">
                    <label class="form-label">Categoría</label>
                    <select id="product-category" class="form-select"></select>
                    <input id="product-category-new" class="form-control mt-2" placeholder="Nueva categoría (opcional)">
                </div>

                <!-- Sección de Precios y Utilidad -->
                <div class="col-12 mt-4 pt-3 border-top">
                    <h6 class="mb-3">Precios y Utilidad</h6>
                    <div class="row g-3">
                        <div class="col-md-3">
                            <label class="form-label">Precio Costo</label>
                            <input id="product-purchase-price" type="number" step="0.01" class="form-control" placeholder="0">
                        </div>
                        <div class="col-md-9">
                            <div class="row">
                                <div class="col-md-3"><label class="form-label">Margen Normal (%)</label><input type="number" id="product-margin-normal" class="form-control" placeholder="0"></div>
                                <div class="col-md-4"><label class="form-label">Margen Esp. 1 (%)</label><input type="number" id="product-margin-special-1" class="form-control" placeholder="0"></div>
                                <div class="col-md-4"><label class="form-label">Margen Esp. 2 (%)</label><input type="number" id="product-margin-special-2" class="form-control" placeholder="0"></div>
                            </div>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Precio Venta (Normal)</label>
                            <input id="product-sale-price" type="number" step="0.01" class="form-control" required placeholder="0">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Precio Especial 1</label>
                            <input id="product-special-price" type="number" step="0.01" class="form-control" placeholder="0">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Precio Especial 2</label>
                            <input id="product-special-price-2" type="number" step="0.01" class="form-control" placeholder="0">
                        </div>
                    </div>
                </div>

                <!-- Sección de Inventario y Proveedor -->
                <div class="col-12 mt-4 pt-3 border-top">
                    <h6 class="mb-3">Inventario y Proveedor</h6>
                    <div class="row g-3">
                        <div class="col-md-4"><label class="form-label">Stock Actual</label><input id="product-stock" type="number" class="form-control" value="0" required></div>
                        <div class="col-md-4"><label class="form-label">Stock Mínimo</label><input id="product-min-stock" type="number" class="form-control" value="0" required></div>
                        <div class="col-md-4"><label class="form-label">Proveedor</label><select id="product-supplier" class="form-select"></select></div>
                    </div>
                </div>

                <div class="col-12 mt-4">
                    <h6 class="mb-3">Unidades de Venta (Variantes)</h6>
                    <!-- NUEVOS ENCABEZADOS PARA VARIANTES -->
                    <div class="row g-1 mb-2 d-none d-lg-flex small text-muted">
                        <div class="col-lg-2">Nombre</div>
                        <div class="col-lg-1">Costo</div>
                        <div class="col-lg-2">P. Normal</div>
                        <div class="col-lg-2">P. Esp. 1</div>
                        <div class="col-lg-2">P. Esp. 2</div>
                        <div class="col-lg-1">Factor</div>
                        <div class="col-lg-2">Acción</div>
                    </div>
                    <div id="variants-container">
                        </div>
                    <button type="button" class="btn btn-sm btn-outline-secondary mt-2" id="add-variant-btn">
                        <i class="fa fa-plus me-1"></i>Añadir Variante
                    </button>
                </div>
                <div class="col-12 d-flex gap-2">
                    <button id="save-product" class="btn btn-primary px-4">Guardar</button>
                    <button id="cancel-product" type="button" class="btn btn-secondary px-4" style="display:none">Cancelar</button>
                </div>
            </form>
        </div>

        <div class="card p-4">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <div>
                    <h5 class="mb-0">Inventario</h5>
                    <p class="card-text mb-0">Valor Inventario: <strong id="total-inventory-value">...</strong></p>
                </div>
                <div class="d-flex gap-2">
                    <button id="exportExcelBtn" class="btn btn-success btn-sm mx-1" aria-label="Exportar a Excel" title="Exportar a Excel">
                        <i class="fas fa-file-excel"></i> Exportar Excel
                    </button>
                    <button id="exportPdfBtn" class="btn btn-danger btn-sm mx-1" aria-label="Exportar a PDF" title="Exportar a PDF">
                        <i class="fas fa-file-pdf"></i> Exportar PDF
                    </button>
                    <input id="search-product" class="form-control" style="width: 250px;" placeholder="Buscar por nombre...">
                </div>
            </div>
            <div class="table-responsive">
                <table class="table table-striped align-middle">
                    <thead>
                        <tr>
                            <th>Código</th>
                            <th>Nombre</th>
                            <th>Precio venta</th>
                            <th>Stock</th>
                            <th>Stock mínimo</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="products-table"></tbody>
                </table>
            </div>
        </div>
    </div>
</body>
</html>
