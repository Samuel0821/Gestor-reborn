<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <title>Cotizaciones - GestorFX</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="../styles.css">
    <script>
        if (!localStorage.getItem('logueado')) {
            window.location.href = 'login.html';
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script defer src="../js/quotes.js"></script>
    <script src="../js/layout.js"></script>
</head>
<body>
    <div class="container py-4">
        <h1>Cotizaciones</h1>
        <div class="card p-4 mb-3">
            <h5 class="card-title">Nueva Cotización</h5>
            <form id="quote-form">
              <div class="mb-3">
                <label for="quote-client-input" class="form-label">Cliente (opcional)</label>
                <input type="text" id="quote-client-input" class="form-control" list="clients-datalist" placeholder="Escriba el nombre o NIT/Cédula del cliente...">
                <datalist id="clients-datalist"></datalist>
                <input type="hidden" id="quote-client-id">
                <select id="quote-client" class="d-none"></select>
              </div>
                <div class="row">
                    <div class="col-6 mb-3">
                        <label for="quote-product-input" class="form-label">Producto</label>
                        <input type="text" class="form-control" id="quote-product-input" list="quote-products-list" placeholder="Escribe el nombre del producto">
                        <datalist id="quote-products-list"></datalist>
                    </div>
                    <div class="col-4 mb-3">
                        <label for="quote-quantity" class="form-label">Cantidad</label>
                        <input type="number" class="form-control" id="quote-quantity" value="1" min="1">
                    </div>
                    <div class="col-2 d-flex align-items-end mb-3">
                        <button type="submit" class="btn btn-primary w-100">Agregar</button>
                    </div>
                </div>
            </form>
        </div>

        <div class="card p-4 mb-3">
            <h5 class="card-title">Ítems de la cotización</h5>
            <div class="table-responsive">
                <table class="table table-striped">
                    <thead>
                        <tr>
                            <th>Ítem</th>
                            <th>Código</th>
                            <th>Producto</th>
                            <th>Cantidad</th>
                            <th>Precio</th>
                            <th>Subtotal</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="quote-items"></tbody>
                    <tfoot>
                        <tr>
                            <td colspan="5" class="text-end"><strong>TOTAL:</strong></td>
                            <td colspan="2"><strong id="quote-total"></strong></td>
                        </tr>
                    </tfoot>
                </table>
            </div>
            <div class="mb-3">
              <label for="quote-notes" class="form-label">Notas / Observaciones (Aparecerán en el PDF)</label>
              <textarea id="quote-notes" class="form-control" rows="2" placeholder="Ej: Cotización válida por 7 días. Precios sujetos a cambio sin previo aviso."></textarea>
            </div>
            <div class="d-flex justify-content-end">
                <button id="finalize-quote" class="btn btn-success">Finalizar Cotización</button>
            </div>
        </div>

        <div class="card p-4">
            <h5 class="card-title">Historial de cotizaciones</h5>
            <div id="quotes-list"></div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
