<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Ajustes - GestorFX</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
  <link rel="stylesheet" href="../styles.css">
    <script>
      if (!localStorage.getItem('logueado')) {
        window.location.href = 'login.html';
      }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script defer src="../js/settings.js"></script>
      <script src="../js/layout.js"></script>
    <script>
      if (!localStorage.getItem('logueado')) {
        window.location.href = 'login.html';
      }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>
  <div class="container py-4">
    <h1>Ajustes</h1>
    
    <div class="row">
      <!-- Botones de navegación (Estilo Reporte) -->
      <div class="col-12 mb-4">
        <div class="btn-group w-100 shadow-sm" role="group" aria-label="Ajustes">
          <button class="btn btn-outline-primary active" id="list-company-list" type="button" onclick="openTab(event, 'list-company')">
            <i class="fa fa-building me-2"></i>Configuración de Empresa
          </button>
          <button class="btn btn-outline-primary" id="list-print-list" type="button" onclick="openTab(event, 'list-print')">
            <i class="fa fa-print me-2"></i>Configuración de Impresión
          </button>
          <button class="btn btn-outline-primary" id="list-users-list" type="button" onclick="openTab(event, 'list-users')">
            <i class="fa fa-users-gear me-2"></i>Gestión de Usuarios
          </button>
        </div>
      </div>

      <!-- Contenido -->
      <div class="col-12">
        <div class="tab-content" id="nav-tabContent">
          
          <!-- Pestaña: Empresa -->
          <div class="tab-pane fade show active" id="list-company" role="tabpanel" aria-labelledby="list-company-list">
            <div class="card p-4">
              <h5 class="card-title mb-3">Ajustes de Empresa</h5>
              <form id="settings-form" class="form-section">
                <div class="mb-3"><label class="form-label">Nombre</label><input id="company-name" class="form-control"></div>
                <div class="mb-3"><label class="form-label">NIT / Cédula</label><input id="company-id-card-or-nit" class="form-control"></div>
                <div class="mb-3"><label class="form-label">Dirección</label><input id="company-address" class="form-control"></div>
                <div class="mb-3"><label class="form-label">Email</label><input id="company-email" class="form-control" type="email"></div>
                <div class="mb-3"><label class="form-label">Teléfono</label><input id="company-phone" class="form-control"></div>
                <div class="mb-3"><label class="form-label">Logo (archivo)</label><input id="company-logo" type="file" accept="image/png,image/jpeg" class="form-control"><div class="mt-2"><img id="logo-preview" style="max-width:200px; display:none"></div></div>
                <button class="btn btn-primary px-4">Guardar Ajustes</button>
                <div id="save-status" class="mt-2"></div>
              </form>
            </div>
          </div>

          <!-- Pestaña: Impresión -->
          <div class="tab-pane fade" id="list-print" role="tabpanel" aria-labelledby="list-print-list">
            <div class="card p-4">
              <h5 class="card-title mb-3">Configuración de Impresión</h5>
              <form id="print-settings-form" class="form-section">
                <div class="mb-3">
                  <label for="printer-select" class="form-label">Seleccionar Impresora Predeterminada</label>
                  <select class="form-select" id="printer-select"></select>
                </div>
                <div class="mb-3">
                  <label for="paper-size" class="form-label">Tamaño del Papel / Ticket</label>
                  <select class="form-select" id="paper-size">
                    <option value="A4">A4</option>
                    <option value="Letter">Carta</option>
                    <option value="80mm">Papel de Rollo (80mm)</option>
                    <option value="57mm">Papel de Rollo (57mm)</option>
                  </select>
                  <div class="form-text">Seleccione "Papel de Rollo" para impresoras térmicas de tickets (POS).</div>
                </div>
                <button type="submit" class="btn btn-primary">Guardar Configuración de Impresión</button>
              </form>
            </div>
          </div>

          <!-- Pestaña: Usuarios -->
          <div class="tab-pane fade" id="list-users" role="tabpanel" aria-labelledby="list-users-list">
            <div class="card p-4">
              <h5 class="card-title mb-3"><i class="fa fa-users-gear me-2"></i>Gestión de Usuarios</h5>
              <div class="row">
                <div class="col-md-4">
                  <form id="user-form" class="p-3 border rounded bg-light">
                    <input type="hidden" id="user-id">
                    <h6 class="mb-3" id="user-form-title">Crear / Editar Usuario</h6>
                    <div class="mb-2">
                      <label class="form-label">Usuario</label>
                      <input type="text" id="user-username" class="form-control" required placeholder="Ej: vendedor1">
                    </div>
                    <div class="mb-2">
                      <label class="form-label">Contraseña <small class="text-muted">(Dejar vacío para no cambiar)</small></label>
                      <input type="password" id="user-password" class="form-control">
                    </div>
                    <div class="mb-2">
                      <label class="form-label">Nombre Completo</label>
                      <input type="text" id="user-fullname" class="form-control" placeholder="Ej: Juan Pérez">
                    </div>
                    <div class="mb-3">
                      <label class="form-label">Rol</label>
                      <select id="user-role" class="form-select">
                        <option value="user">Usuario (Vendedor)</option>
                        <option value="admin">Administrador</option>
                      </select>
                    </div>
                    <div class="d-grid gap-2">
                      <button type="submit" class="btn btn-primary">Guardar Usuario</button>
                      <button type="button" id="cancel-user-edit" class="btn btn-secondary" style="display:none;">Cancelar</button>
                    </div>
                  </form>
                </div>
                <div class="col-md-8">
                  <h6 class="mb-3">Usuarios Registrados</h6>
                  <div class="table-responsive">
                    <table class="table table-striped align-middle">
                      <thead>
                        <tr>
                          <th>Usuario</th>
                          <th>Nombre</th>
                          <th>Rol</th>
                          <th>Acciones</th>
                        </tr>
                      </thead>
                      <tbody id="users-table"></tbody>
                    </table>
                  </div>
                </div>
              </div>
            </div>
          </div>

        </div>
      </div>
    </div>
  </div>
  <script>
    function openTab(evt, tabId) {
      // Ocultar todos los paneles
      const panes = document.querySelectorAll('.tab-pane');
      panes.forEach(p => p.classList.remove('show', 'active'));

      // Desactivar todos los botones
      const buttons = document.querySelectorAll('.btn-group .btn');
      buttons.forEach(b => b.classList.remove('active'));

      // Activar actual
      document.getElementById(tabId).classList.add('show', 'active');
      evt.currentTarget.classList.add('active');
    }
  </script>
</body>
</html>
