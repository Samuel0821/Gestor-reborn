<!doctype html> 
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Ventas - GestorFX</title>
  
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  
  <!-- FontAwesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
  <link rel="stylesheet" href="../styles.css">

  <script>
    if (!localStorage.getItem('logueado')) {
      window.location.href = 'login.html';
    }
  </script>

  <!-- Bootstrap JS Bundle (con Popper) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <!-- Tu script -->
  <script defer src="../js/sales.js"></script>
  <script src="../js/layout.js"></script>
</head>
<body>
  <div class="container py-4">
    <h1>Ventas</h1>
  
    <!-- Navegación por Pestañas -->
    <ul class="nav nav-tabs mb-4" id="salesTabs" role="tablist">
      <li class="nav-item" role="presentation">
        <button class="nav-link active" id="quick-sale-tab" data-bs-toggle="tab" data-bs-target="#quick-sale-pane" type="button" role="tab" aria-controls="quick-sale-pane" aria-selected="true"><i class="fa fa-cash-register me-2"></i>Venta Rápida</button>
      </li>
      <li class="nav-item" role="presentation">
        <button class="nav-link" id="history-tab" data-bs-toggle="tab" data-bs-target="#history-pane" type="button" role="tab" aria-controls="history-pane" aria-selected="false"><i class="fa fa-history me-2"></i>Historial de Ventas</button>
      </li>
      <li class="nav-item" role="presentation">
        <button class="nav-link" id="credits-tab" data-bs-toggle="tab" data-bs-target="#credits-pane" type="button" role="tab" aria-controls="credits-pane" aria-selected="false"><i class="fa fa-credit-card me-2"></i>Gestión de Créditos</button>
      </li>
    </ul>

    <div class="tab-content" id="salesTabsContent">
      
      <!-- Tab 1: Venta Rápida -->
      <div class="tab-pane fade show active" id="quick-sale-pane" role="tabpanel" aria-labelledby="quick-sale-tab">
        <!-- Venta rápida -->
        <div class="card p-4 mb-4">
          <h5 class="mb-3">Venta rápida</h5>

          <form id="sale-form" class="row g-3">

            <!-- Selección de cliente (opcional) -->
            <div class="card p-4 mb-4">
              <h5 class="mb-3">Cliente (opcional)</h5>
              <div class="input-group">
                <span class="input-group-text"><i class="fa fa-user"></i></span>
                <select id="sale-client" class="form-select">
                  <option value="">-- Venta sin cliente --</option>
                </select>
              </div>
            </div>

            <!-- 🔹 Nuevo campo para escanear código de barras -->
            <div class="mb-3">
              <label for="barcode-input" class="form-label">Escanear / Ingresar código de barras</label>
              <div class="input-group">
                <span class="input-group-text"><i class="fa fa-barcode"></i></span>
                <input type="text" id="barcode-input" class="form-control" placeholder="Escanea o escribe y presiona Enter" autofocus>
              </div>
            </div>
            <!-- 🔹 Fin campo nuevo -->
        
            <div class="col-md-6">
              <label class="form-label">Producto</label>
              <div class="input-group">
                <span class="input-group-text"><i class="fa fa-box"></i></span>
                <input list="products-list" id="sale-product-input" class="form-control" placeholder="Buscar producto...">
                <datalist id="products-list"></datalist>
              </div>
            </div>
            <div class="col-md-3">
              <label class="form-label">Cantidad</label>
              <div class="input-group">
                <span class="input-group-text"><i class="fa fa-hashtag"></i></span>
                <input id="sale-quantity" type="number" class="form-control" min="1" value="1">
              </div>
            </div>
            <div class="col-md-3 d-flex align-items-end">
              <button class="btn btn-primary w-100"><i class="fa fa-plus me-2"></i>Agregar</button>
            </div>
          </form>
        </div>

        <!-- Items de la venta -->
        <div class="card p-4 mb-4">
          <h5 class="mb-3">Items de la venta</h5>
          <div class="table-responsive">
            <table class="table table-striped align-middle table-sm">
              <thead>
                <tr><th>Ítem</th><th>Código</th><th>Producto</th><th>Serial (Garantía)</th><th>Cantidad</th><th>Precio</th><th>Subtotal</th><th>Acciones</th></tr>
              </thead>
              <tbody id="sale-items"></tbody>
            </table>
          </div>
          <div class="text-end fw-bold" id="sale-total">TOTAL: $0</div>
          <div class="col-12 mt-3">
            <label for="sale-type" class="form-label">Tipo de Venta</label>
            <div class="input-group">
              <span class="input-group-text"><i class="fa fa-money-bill-wave"></i></span>
              <select id="sale-type" class="form-select">
                <option value="cash">Contado</option>
                <option value="credit">Crédito</option>
              </select>
            </div>
          </div>
          <div class="mt-2">
            <button id="finalize-sale" class="btn btn-success px-4">Finalizar Venta</button>
          </div>
        </div>
      </div>

      <!-- Tab 2: Historial de Ventas -->
      <div class="tab-pane fade" id="history-pane" role="tabpanel" aria-labelledby="history-tab">
        <div class="card p-4 mb-4">
          <h5 class="mb-3">Historial de ventas</h5>
          <div id="sales-list"></div>
        </div>
      </div>

      <!-- Tab 3: Gestión de Créditos -->
      <div class="tab-pane fade" id="credits-pane" role="tabpanel" aria-labelledby="credits-tab">
        <div class="card p-4 mb-4">
          <h5 class="mb-3">Gestión de Créditos</h5>
          <div class="input-group mb-3">
            <input type="text" class="form-control" id="credit-search-input" placeholder="Buscar por cliente...">
            <button class="btn btn-outline-secondary" type="button" id="credit-search-btn">Buscar</button>
          </div>
          <div id="credits-list"></div>
        </div>
      </div>

    </div>
  </div>
</body>
</html>
